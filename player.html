<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rankify — Player</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .player-page {
            max-width: 1200px;
            margin: auto;
            padding: 60px 25px;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 25px;
            color: #9296a3;
            text-decoration: none;
        }

        .back-button:hover {
            color: #ffcf33;
        }

        .player-header {
            padding: 35px;
            margin-bottom: 20px;

            background: #101219;
            border: 1px solid #20232d;
            border-radius: 20px;
        }

        .player-header-top {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .avatar {
            width: 80px;
            height: 80px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background: #ffcf33;
            color: #111;

            font-size: 35px;
            font-weight: 900;
        }

        .player-name {
            font-size: 38px;
            font-weight: 900;
        }

        .player-tag {
            margin-top: 7px;
            color: #777c89;
            font-family: monospace;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .stat-card {
            padding: 25px;

            background: #101219;
            border: 1px solid #20232d;
            border-radius: 16px;
        }

        .stat-icon {
            font-size: 24px;
        }

        .stat-name {
            margin-top: 15px;
            color: #777c89;
            font-size: 12px;
            font-weight: 700;
        }

        .stat-value {
            margin-top: 7px;
            font-size: 26px;
            font-weight: 900;
        }

        .section {
            margin-top: 20px;
            padding: 30px;

            background: #101219;
            border: 1px solid #20232d;
            border-radius: 20px;
        }

        .section-title {
            margin-bottom: 25px;
            text-align: left;
        }

        .section-title h2 {
            font-size: 25px;
            margin-top: 5px;
        }

        .section-title span {
            color: #ffcf33;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .brawler-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
        }

        .brawler {
            padding: 18px;

            background: #151720;
            border: 1px solid #242733;
            border-radius: 14px;
        }

        .brawler-name {
            font-weight: 800;
        }

        .brawler-info {
            margin-top: 8px;
            color: #858996;
            font-size: 13px;
        }

        .loading {
            text-align: center;
            padding: 100px 20px;
            color: #777c89;
        }

        .error {
            padding: 25px;

            background: #191116;
            border: 1px solid #4d2630;
            border-radius: 15px;

            color: #ff7d8d;
        }

        @media (max-width: 900px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .brawler-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 550px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .brawler-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .player-name {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<header class="navbar">

    <div class="logo">
        <span>R</span> Rankify
    </div>

    <nav>
        <a href="index.html">Accueil</a>
        <a href="index.html#search">Recherche</a>
    </nav>

</header>


<main class="player-page">

    <a href="index.html" class="back-button">
        ← Retour
    </a>

    <div id="loading" class="loading">
        🔎 Chargement du profil...
    </div>


    <div id="content" style="display:none;">

        <section class="player-header">

            <div class="player-header-top">

                <div class="avatar" id="avatar">
                    ?
                </div>

                <div>

                    <div class="player-name" id="playerName">
                        Joueur
                    </div>

                    <div class="player-tag" id="playerTag">
                        #PLAYER
                    </div>

                </div>

            </div>

        </section>


        <section class="stats-grid">

            <div class="stat-card">

                <div class="stat-icon">🏆</div>

                <div class="stat-name">
                    TROPHÉES
                </div>

                <div class="stat-value" id="trophies">
                    -
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">⭐</div>

                <div class="stat-name">
                    XP LEVEL
                </div>

                <div class="stat-value" id="xp">
                    -
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">🎮</div>

                <div class="stat-name">
                    VICTOIRES 3V3
                </div>

                <div class="stat-value" id="threeVsThree">
                    -
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">⚔️</div>

                <div class="stat-name">
                    VICTOIRES SOLO
                </div>

                <div class="stat-value" id="solo">
                    -
                </div>

            </div>

        </section>


        <section class="section">

            <div class="section-title">

                <span>BRAWLERS</span>

                <h2>
                    Brawlers du joueur
                </h2>

            </div>

            <div
                id="brawlers"
                class="brawler-grid"
            ></div>

        </section>


        <section class="section">

            <div class="section-title">

                <span>CLUB</span>

                <h2>
                    Club
                </h2>

            </div>

            <div id="club">
                Aucun club
            </div>

        </section>

    </div>


    <div
        id="error"
        class="error"
        style="display:none;"
    ></div>

</main>


<footer>

    <div>
        © 2026 Rankify
    </div>

    <div>
        Brawl Stars Player Analytics
    </div>

</footer>


<script>

const API_URL = "http://127.0.0.1:5000";

const loading =
    document.getElementById("loading");

const content =
    document.getElementById("content");

const errorBox =
    document.getElementById("error");


async function loadPlayer() {

    const stored =
        sessionStorage.getItem("rankifyPlayer");

    if (!stored) {

        showError(
            "Aucun joueur sélectionné."
        );

        return;
    }


    const player = JSON.parse(stored);


    document.getElementById(
        "playerName"
    ).textContent =
        player.name || "Joueur";


    document.getElementById(
        "playerTag"
    ).textContent =
        player.tag || "";


    document.getElementById(
        "avatar"
    ).textContent =
        (player.name || "?")
        .charAt(0)
        .toUpperCase();


    document.getElementById(
        "trophies"
    ).textContent =
        formatNumber(player.trophies);


    document.getElementById(
        "xp"
    ).textContent =
        formatNumber(player.expLevel);


    document.getElementById(
        "threeVsThree"
    ).textContent =
        formatNumber(
            player["3vs3Victories"]
        );


    document.getElementById(
        "solo"
    ).textContent =
        formatNumber(
            player.soloVictories
        );


    if (player.club) {

        document.getElementById(
            "club"
        ).textContent =
            `${player.club.name} (${player.club.tag})`;

    }


    const brawlers =
        player.brawlers || [];

    const container =
        document.getElementById("brawlers");


    if (brawlers.length === 0) {

        container.innerHTML =
            "<p>Aucun Brawler disponible.</p>";

    } else {

        container.innerHTML =
            brawlers.map(brawler => `

                <div class="brawler">

                    <div class="brawler-name">
                        ${escapeHTML(brawler.name)}
                    </div>

                    <div class="brawler-info">
                        🏆 ${formatNumber(brawler.trophies)}
                    </div>

                    <div class="brawler-info">
                        ⚡ Power ${brawler.power}
                    </div>

                </div>

            `).join("");

    }


    loading.style.display = "none";

    content.style.display = "block";
}


function formatNumber(number) {

    if (
        number === undefined ||
        number === null
    ) {
        return "-";
    }

    return Number(number).toLocaleString("fr-FR");
}


function escapeHTML(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function showError(message) {

    loading.style.display = "none";

    errorBox.textContent =
        "❌ " + message;

    errorBox.style.display =
        "block";
}


loadPlayer();

</script>

</body>

</html>
